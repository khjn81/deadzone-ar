name: Verify DEADZONE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile, production]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use Ubuntu archive for browser dependencies
        timeout-minutes: 1
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          sources = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*'))
          for source in sources:
              if source.is_file():
                  before = source.read_text()
                  after = before.replace('http://azure.archive.ubuntu.com', 'https://archive.ubuntu.com')
                  after = after.replace('https://azure.archive.ubuntu.com', 'https://archive.ubuntu.com')
                  if after != before:
                      source.write_text(after)
                      print(f'Using Ubuntu archive in {source}')
          Path('/etc/apt/apt.conf.d/99-browser-timeouts').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n'
          )
          PYTHON
      - run: npx playwright install --with-deps chromium
        if: matrix.suite != 'production'
        timeout-minutes: 5
      - run: npx playwright install --with-deps chromium webkit
        if: matrix.suite == 'production'
        timeout-minutes: 5
      - run: npm test
      - if: matrix.suite != 'production'
        run: npx playwright test --project=${{ matrix.suite }} --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json
      - if: matrix.suite == 'production'
        run: npm run test:release
      - if: matrix.suite == 'production'
        run: npm run test:graphics -- --artifact test-results-release/graphics.json --screenshot-dir test-results-release/graphics
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: |
            test-results/
            test-results-release/
          retention-days: 7
